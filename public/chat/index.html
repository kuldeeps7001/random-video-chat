<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Video Chat - Chat</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" type="image/png" href="/logo.png" />
</head>
<body class="chat-page">
  <div class="container">
    <header>
      <div class="logo-wrapper"><img src="/logo.png" alt="Random Video Chat" class="app-logo" /></div>
      <p class="subtitle">You are in chat mode. Connect & enjoy!</p>
      <a href="/" style="color:#fff; text-decoration:underline; font-size:0.9rem;">← Back to Home</a>
    </header>

    <div class="main-content">
      <div class="video-section">
        <div class="video-container remote">
          <video id="remoteVideo" autoplay playsinline></video>
          <div class="local-overlay">
            <video id="localVideo" autoplay muted playsinline></video>
          </div>
          <div class="video-overlay" id="statusOverlay">
            <div class="loader-wrapper">
              <div class="loading-spinner"></div>
            </div>
            <div class="status-message" id="statusMessage">
              Click "Start" to begin chatting
            </div>
          </div>
        </div>
      </div>

      <div class="chat-section">
        <div class="chat-header"><span>💬 Text Chat</span></div>
        <div class="chat-messages" id="chatMessages">
          <div class="system-message">Send a message to start chatting...</div>
        </div>
        <div class="chat-input-container">
          <input type="text" id="chatInput" placeholder="Type a message..." disabled />
          <button id="sendBtn" disabled>Send</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="startBtn" class="btn btn-primary"><span class="btn-icon">▶️</span>Start</button>
      <button id="nextBtn" class="btn btn-secondary" disabled><span class="btn-icon">⏭️</span>Next</button>
      <button id="stopBtn" class="btn btn-danger" disabled><span class="btn-icon">⏹️</span>Stop</button>
    </div>

    <footer class="info-footer">
      <div class="info-item"><span class="info-label">Status:</span><span id="connectionStatus" class="status-offline">Offline</span></div>
      <div class="info-item"><span class="info-label">⚠️ Be respectful and follow community guidelines</span></div>
    </footer>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/client.js"></script>
</body>
</html>
